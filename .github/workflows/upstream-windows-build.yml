name: ABUKHALED AI - Pinned Windows Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upstream-windows-build.yml'
      - 'scripts/apply-branding.mjs'

permissions:
  contents: read

concurrency:
  group: abukhaled-windows-${{ github.ref }}
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: cheaper-inference/OmniRoute
  UPSTREAM_COMMIT: 5dbd2eb6880f9e7bd1962c44df5710cf46f52096
  EXPECTED_UPSTREAM_VERSION: '3.8.53'

jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - name: Check out ABUKHALED AI integration
        uses: actions/checkout@v5
        with:
          path: abukhaled
          persist-credentials: false

      - name: Check out pinned OmniRoute source
        uses: actions/checkout@v5
        with:
          repository: cheaper-inference/OmniRoute
          ref: 5dbd2eb6880f9e7bd1962c44df5710cf46f52096
          path: upstream
          fetch-depth: 1
          persist-credentials: false

      - name: Verify immutable source, package versions and lockfiles
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = (git -C upstream rev-parse HEAD).Trim().ToLowerInvariant()
          if ($sha -ne $env:UPSTREAM_COMMIT) {
            throw "Pinned source mismatch. Expected $env:UPSTREAM_COMMIT, got $sha"
          }
          $root = Get-Content upstream/package.json -Raw | ConvertFrom-Json
          $electron = Get-Content upstream/electron/package.json -Raw | ConvertFrom-Json
          if ($root.version -ne $env:EXPECTED_UPSTREAM_VERSION) {
            throw "Unexpected root version $($root.version)"
          }
          if ($electron.version -ne $root.version) {
            throw "Root/Electron version mismatch: $($root.version) / $($electron.version)"
          }
          foreach ($lock in @('upstream/package-lock.json', 'upstream/electron/package-lock.json')) {
            if (-not (Test-Path $lock)) { throw "Missing lockfile: $lock" }
          }
          @(
            "Repository: $env:UPSTREAM_REPOSITORY"
            "Pinned commit: $sha"
            "Root version: $($root.version)"
            "Electron version: $($electron.version)"
            "Runner: $env:RUNNER_OS / $env:RUNNER_ARCH"
          ) | Set-Content upstream-revision.txt
          "UPSTREAM_SHA=$sha" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            upstream/package-lock.json
            upstream/electron/package-lock.json

      - name: Record toolchain
        shell: pwsh
        run: |
          node --version
          npm --version
          git --version


      - name: Install root dependencies from lockfile
        working-directory: upstream
        shell: pwsh
        run: npm ci --no-audit --no-fund

      - name: Install Electron dependencies from lockfile
        working-directory: upstream
        shell: pwsh
        run: npm ci --prefix electron --no-audit --no-fund

      - name: Apply ABUKHALED desktop identity and updater isolation
        shell: pwsh
        run: |
          node abukhaled/scripts/apply-branding.mjs upstream

      - name: Build Windows app without publishing
        working-directory: upstream
        shell: pwsh
        run: |
          npm run electron:build:win

      - name: Verify branded package and collect outputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path (Resolve-Path upstream).Path 'electron\dist-electron'
          if (-not (Test-Path $output)) { throw "Missing build output: $output" }

          $files = @(Get-ChildItem -Path $output -File -Filter '*.exe')
          if ($files.Count -lt 2) {
            Get-ChildItem -Path $output -Force | Select-Object Name, Length
            throw 'Expected both portable and installer EXE outputs.'
          }
          $branded = @($files | Where-Object { $_.Name -match '(?i)ABUKHALED' })
          if ($branded.Count -lt 2) {
            $files | Select-Object Name, Length
            throw 'Build produced EXEs, but expected ABUKHALED-branded filenames were not found.'
          }
          $setup = @($branded | Where-Object { $_.Name -match '(?i)setup.*\.exe$|\.setup\.' })
          if ($setup.Count -eq 0) { throw 'No ABUKHALED Setup installer found.' }

          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          foreach ($file in $branded) {
            Copy-Item -LiteralPath $file.FullName -Destination (Join-Path artifacts $file.Name) -Force
          }
          Copy-Item upstream-revision.txt artifacts/upstream-revision.txt -Force
          Get-ChildItem artifacts -File | Select-Object Name, Length

      - name: Smoke-test packaged Electron app
        working-directory: upstream
        shell: pwsh
        run: npm run electron:smoke:packaged

      - name: Verify packaged metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = Get-Content upstream/electron/package.json -Raw | ConvertFrom-Json
          if ($pkg.build.productName -ne 'ABUKHALED AI') { throw 'Packaged productName is not ABUKHALED AI.' }
          if ($pkg.build.appId -ne 'online.omniroute.desktop') { throw 'The migration-safe appId changed unexpectedly.' }
          if ($null -ne $pkg.build.publish) { throw 'Upstream publish target must remain removed.' }

      - name: Generate SHA-256 manifest
        shell: pwsh
        run: |
          $lines = Get-ChildItem artifacts -File | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $lines | Set-Content artifacts/SHA256SUMS.txt
          Get-Content artifacts/SHA256SUMS.txt

      - name: Upload verified build evidence
        uses: actions/upload-artifact@v6
        with:
          name: abukhaled-ai-windows-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
